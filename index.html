<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7fb">
  <meta name="description" content="Çevrimdışı bitkisel besin matriksi ve tarif hesaplayıcı">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Besin Matriksi">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ipc: http://ipc.localhost data:">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Besin Matriksi</title>
</head>
<body>
  <div id="ruler" aria-hidden="true"></div>
  <div id="app"><p style="padding:2rem;font-family:sans-serif">Besin Matriksi yükleniyor…</p></div>
  <noscript>Bu uygulama JavaScript gerektirir.</noscript>
  <script>
    // Açılış bekçisi: uygulama 10 sn'de açılmazsa (ör. tarayıcıda bozuk/eski önbellek) boş ekran yerine kurtarma düğmesi
    setTimeout(function () {
      if (window.__bmBooted) return;
      var en = (navigator.language || '').toLowerCase().indexOf('tr') !== 0;
      var box = document.getElementById('app');
      box.innerHTML = '<div style="padding:2rem;font-family:sans-serif;max-width:32rem;margin:auto"><h1 style="font-size:1.3rem">' + (en ? 'Besin Matriksi did not start' : 'Besin Matriksi açılamadı') + '</h1><p>' + (en ? 'Your browser may be holding an old or broken copy. This clears only the app cache; your recipes and settings stay.' : 'Tarayıcın eski ya da bozuk bir kopyayı tutuyor olabilir. Bu yalnız uygulama önbelleğini temizler; tariflerin ve ayarların kalır.') + '</p><button id="bm-recover" style="font-size:1rem;padding:.7rem 1.2rem;border-radius:12px">' + (en ? 'Clear cache and reload' : 'Önbelleği temizle ve yeniden yükle') + '</button></div>';
      document.getElementById('bm-recover').onclick = function () {
        var jobs = [];
        if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
        if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
        Promise.all(jobs).catch(function () {}).then(function () { location.reload(); });
      };
    }, 10000);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
