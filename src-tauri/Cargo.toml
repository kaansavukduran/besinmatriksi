[package]
name = "besin-matriksi"
version = "1.1.2-beta.21"
description = "Çevrimdışı bitkisel besin matriksi"
edition = "2021"
license = "MIT"

[lib]
name = "besin_matriksi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
