name: Derle ve yayınla

# Manuel publish seçilmedikçe yalnız artifact üretilir.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Bu sürümü Releases üzerinde yayımla / Publish this release'
        type: boolean
        default: false
      prerelease:
        description: 'Beta olarak yayımla / Mark as pre-release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  web:
    name: Web / PWA / tek dosya HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Paketle
        run: |
          mkdir -p out
          cp dist-single/besin-matriksi.html out/besin-matriksi-tek-dosya.html
          cp public/THIRD_PARTY_NOTICES.txt out/THIRD_PARTY_NOTICES.txt
          cp LICENSE out/LICENSE.txt
          cp docs/INSTALL.md out/KURULUM.md
          (cd dist && zip -qr ../out/besin-matriksi-web-pwa.zip .)
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  desktop:
    name: Masaüstü (${{ matrix.name }})
    needs: web
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows, os: windows-latest, args: '' }
          - { name: macos, os: macos-latest, args: '--target universal-apple-darwin' }
          - { name: linux, os: ubuntu-22.04, args: '' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: './src-tauri -> target' }
      - name: Linux bağımlılıkları
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npx tauri build ${{ matrix.args }}
      - run: node scripts/native-notices.mjs out/THIRD_PARTY_NOTICES-RUST-${{ matrix.name }}.txt
      - name: Çıktıları topla
        shell: bash
        run: |
          mkdir -p out
          T=src-tauri/target
          if [ "${{ matrix.name }}" = "windows" ]; then
            cp $T/release/bundle/nsis/*.exe out/ || true
            cp $T/release/bundle/msi/*.msi out/ || true
            # Kurulum gerektirmeyen tek exe (Windows 10/11'de yerleşik WebView2 kullanır)
            cp $T/release/besin-matriksi.exe "out/BesinMatriksi-portable-x64.exe"
          elif [ "${{ matrix.name }}" = "macos" ]; then
            cp $T/universal-apple-darwin/release/bundle/dmg/*.dmg out/
          else
            cp $T/release/bundle/appimage/*.AppImage out/
            cp $T/release/bundle/deb/*.deb out/
            cp $T/release/bundle/rpm/*.rpm out/ || true
          fi
          cp LICENSE out/LICENSE.txt
          cp public/THIRD_PARTY_NOTICES.txt out/THIRD_PARTY_NOTICES.txt
          cp docs/INSTALL.md out/KURULUM.md
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: out/*

  android:
    name: Android APK
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm run build
      - run: npx cap add android
      - run: node scripts/mobile-version.mjs android
      - run: node scripts/mobile-icons.mjs android
      - run: npx cap sync android
      - name: APK derle
        working-directory: android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          mkdir -p ../out
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > release.keystore
            ./gradlew assembleRelease
            APK=$(ls app/build/outputs/apk/release/*-unsigned.apk)
            BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
            $BT/zipalign -p 4 "$APK" aligned.apk
            $BT/apksigner sign --ks release.keystore --ks-pass env:KS_PASS --ks-key-alias "$KS_ALIAS" --out ../out/BesinMatriksi.apk aligned.apk
          else
            # İmza anahtarı tanımlı değil: doğrudan kurulabilen debug imzalı APK
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../out/BesinMatriksi.apk
          fi
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/apksigner verify --print-certs ../out/BesinMatriksi.apk > ../out/ANDROID-SIGNING.txt
      - run: cp LICENSE out/LICENSE.txt && cp public/THIRD_PARTY_NOTICES.txt out/THIRD_PARTY_NOTICES.txt && cp docs/INSTALL.md out/KURULUM.md
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/* }

  ios:
    name: iOS (imzasız IPA)
    needs: web
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx cap add ios
      - run: node scripts/mobile-version.mjs ios
      - run: node scripts/mobile-icons.mjs ios
      - run: npx cap sync ios
      - name: Derle (imzasız)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr out/BesinMatriksi-unsigned.ipa Payload
      - run: cp LICENSE out/LICENSE.txt && cp public/THIRD_PARTY_NOTICES.txt out/THIRD_PARTY_NOTICES.txt && cp docs/INSTALL.md out/KURULUM.md
      - uses: actions/upload-artifact@v4
        with: { name: ios, path: out/* }

  prepare_release:
    name: Release dosyalarını hazırla / Prepare release files
    needs: [web, desktop, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Paketlerin bütünlüğünü kaydet
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/release-assets.mjs artifacts publish
          git archive --format=zip --prefix=besinmatriksi/ -o publish/BesinMatriksi-$(node -p "require('./package.json').version")-source.zip HEAD
          cp docs/RELEASE_NOTES.md publish/RELEASE_NOTES.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          files = sorted(p for p in Path('publish').iterdir() if p.name != 'SHA256SUMS.txt')
          Path('publish/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest() + '  ' + p.name + '\n' for p in files))
          PY
      - uses: actions/upload-artifact@v4
        with: { name: release-candidate, path: 'publish/*' }

  release:
    name: GitHub Release
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: prepare_release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { name: release-candidate, path: publish }
      - id: version
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Besin Matriksi ${{ steps.version.outputs.tag }}
          draft: true
          prerelease: ${{ inputs.prerelease }}
          files: publish/*
          fail_on_unmatched_files: true
          body_path: docs/RELEASE_NOTES.md
      - name: Doğrulanmış taslağı yayımla / Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/release-assets.txt
          gh release download "$TAG" --dir verified-downloads
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {p.name for p in Path('publish').iterdir()}
          actual = set(Path('/tmp/release-assets.txt').read_text().splitlines())
          if expected != actual: raise SystemExit('Release asset list mismatch')
          for name in expected:
              original, downloaded = Path('publish', name), Path('verified-downloads', name)
              if hashlib.sha256(original.read_bytes()).digest() != hashlib.sha256(downloaded.read_bytes()).digest():
                  raise SystemExit('Release asset digest mismatch: ' + name)
          PY
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
