name: Test

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Veri dosyaları ham kaynaklarla güncel mi?
        run: |
          npm run data
          git diff --exit-code -- src/data || (echo "src/data güncel değil: npm run data çalıştırıp işle" && exit 1)
      - run: node scripts/build-notices.mjs --check
      - run: npm test
      - run: npm run build
      - run: npm run build:single
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-traces
          path: test-results/
          retention-days: 7
