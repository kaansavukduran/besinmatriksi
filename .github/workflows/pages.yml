name: GitHub Pages (iPhone/Android için yüklenebilir PWA)

# Üretim dalı güncellenince yayımla. İlk kurulumda Settings → Pages → Source:
# GitHub Actions seçilmelidir; bu iş akışı yönetici ayarını değiştirmez.
on:
  push:
    branches: [ccr-1e1934aa-iv8aev]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  # B237: GitHub'ın Pages şablonundaki gibi derleme ve yayın ayrı işler. Tek işte yayın adımı, aynı saniyede yüklenen
  # artifact'ı bazen bulamıyordu ("Found 0 artifact(s)"; koşu 110, 112, 115, 122). Ayrı iş, yükleme tamamlanınca başlar.
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: 22, cache: npm }
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: { path: dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.d.outputs.page_url }}' }
    steps:
      - id: d
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
