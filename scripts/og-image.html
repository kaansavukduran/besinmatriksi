<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: B; src: url('bric.woff2'); font-weight: 700; } @font-face { font-family: B; src: url('bricx.woff2'); font-weight: 700; unicode-range: U+0100-024F; }
@font-face { font-family: A; src: url('atk.woff2'); font-weight: 400; } @font-face { font-family: A; src: url('atkx.woff2'); font-weight: 400; unicode-range: U+0100-024F; }
html,body{margin:0}
body{width:1200px;height:630px;background:#f7f4ec;color:#29372a;font-family:A,sans-serif;display:flex;align-items:center;box-sizing:border-box;padding:0 90px;gap:70px;position:relative;overflow:hidden}
.l{flex:1}
.logo{display:flex;align-items:center;gap:22px;margin-bottom:40px}
.logo img{width:96px;height:96px;border-radius:24px}
.logo b{font-family:B;font-size:46px;letter-spacing:-.5px}
h1{font-family:B;font-size:74px;line-height:1.02;margin:0 0 26px;letter-spacing:-1.5px}
p{font-size:30px;line-height:1.35;color:#4c5745;margin:0 0 34px;max-width:620px}
.chips{display:flex;gap:12px;flex-wrap:wrap}
.chips span{background:#fffdf8;border:2px solid #dedfd0;border-radius:999px;padding:10px 20px;font-size:23px}
.card{width:330px;background:#fffdf8;border:2px solid #dedfd0;border-radius:28px;padding:30px 30px 24px;box-shadow:0 18px 40px rgb(40 50 30 / .10)}
.card h3{font-family:B;font-size:30px;margin:0 0 6px}.card small{font-size:19px;color:#646c5c}
.row{display:flex;justify-content:space-between;font-size:22px;padding:11px 0;border-bottom:1px solid #e9e8dc}
.row b{font-weight:700}.bar{height:9px;border-radius:9px;background:#efeee3;margin-top:6px}.bar i{display:block;height:100%;border-radius:9px;background:#4a5d32}
</style></head><body>
<div class="l"><div class="logo"><img src="icon.svg"><b>Besin Matriksi</b></div>
<h1>Tabağında<br>ne var?</h1>
<p>690+ besinin ayrıntılı besin matriksi, tarif ve günlük hesabı. İnternetsiz çalışır.</p>
<div class="chips"><span>USDA ölçümleri</span><span>Amino asitler</span><span>Bitkisel ağırlıklı</span><span>TR / EN</span></div></div>
<div class="card"><h3>Nohut</h3><small>Kuru · 100 g</small>
<div class="row"><span>Enerji</span><b>378 kcal</b></div>
<div class="row"><span>Protein</span><b>20,5 g</b></div><div class="bar"><i style="width:45%"></i></div>
<div class="row"><span>Lif</span><b>12,2 g</b></div><div class="bar"><i style="width:41%"></i></div>
<div class="row"><span>Folat</span><b>557 µg</b></div><div class="bar"><i style="width:100%"></i></div>
</div></body></html>
